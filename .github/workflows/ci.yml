name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.12"]
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Test
        run: python -m unittest discover -s tests -v

      - name: Smoke test the console script
        run: moonterm --plain -d 2026-11-24T15:00Z

      - name: Check the JSON payload
        run: python -m moonterm --json -d 2026-11-24T15:00Z > phase.json

      - name: Validate the JSON payload
        run: python -c "import json; d=json.load(open('phase.json')); assert d['phase_name']=='Full Moon', d; print('ok', d['illumination'])"
