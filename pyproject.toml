[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "moonterm"
description = "Draw the moon in your terminal - pure Python, no dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dynamic = ["version"]
authors = [{ name = "moonterm contributors" }]
keywords = ["moon", "moon-phase", "astronomy", "terminal", "ascii-art", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Terminals",
]

[project.scripts]
moonterm = "moonterm.cli:main"

[project.urls]
Homepage = "https://github.com/yqlwb12/moonterm"
Issues = "https://github.com/yqlwb12/moonterm/issues"
Changelog = "https://github.com/yqlwb12/moonterm/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "moonterm.__version__" }

[tool.setuptools.package-data]
moonterm = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
